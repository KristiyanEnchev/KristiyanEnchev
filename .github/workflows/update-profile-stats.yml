name: Update profile statistics

on:
  schedule:
    - cron: "15 5 * * *" # Daily; GitHub schedules use UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Require private statistics token
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PRIVATE_STATS_TOKEN }}
        run: |
          if [ -z "$PROFILE_STATS_TOKEN" ]; then
            echo "::error::Create the Actions secret PRIVATE_STATS_TOKEN before running this workflow."
            exit 1
          fi

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=KristiyanEnchev&show_icons=true&hide_border=true&hide_rank=false&theme=tokyonight&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.PRIVATE_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate most-used languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=KristiyanEnchev&layout=compact&langs_count=6&hide_border=true&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.PRIVATE_STATS_TOKEN }}
          fail_on_error: true

      - name: Commit refreshed SVG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "Stats cards are up to date."
            exit 0
          fi
          git commit -m "chore: refresh profile statistics"
          git push
